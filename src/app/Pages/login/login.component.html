<div class="drop-shadow-2xl rounded bg-zinc-100 w-[42%] h-[350px] mx-auto mt-5">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="w-[500px] ml-4 mt-8">
        <h1 class="text-center">Add Product</h1>
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input formControlName="email" type="email" class="form-control">
          <div *ngIf="form.get('email')?.invalid && (form.get('email')?.dirty || form.get('email')?.touched)">
            <span *ngIf="form.get('email')?.hasError('required')">khong duoc de trong</span>
            <span *ngIf="form.get('email')?.hasError('email')">khong dung dinh dang</span>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input formControlName="password" type="password" class="form-control">
        </div> 
        
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
</div>

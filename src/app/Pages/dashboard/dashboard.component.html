<table class="table table-striped">
    <thead>
      <tr>
        <th>name</th>
        <th>image</th>
        <th>price</th>
        <th>category</th>
        <th>description</th>
        <th><a [routerLink]="['add']">add</a></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of products">
        <td>{{item.name}}</td>
        <td><img src="{{item.image}}" alt=""></td>
        <td>{{item.price}}</td>
        <td>{{item.category}}</td>
        <td>{{item.description}}</td>
        <td>
          <button class="btn btn-primary" (click)="dlProduct(item.id!)">delete</button>
          <a [routerLink]="['edit', item.id]">edit</a>
        </td>
      </tr>
    </tbody>
  </table>
